version: "3.8"

services:
  rag-service:
    build: .
    container_name: themison-rag-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Transport — "http" (default) or "grpc"
      TRANSPORT: "http"
      HTTP_PORT: 8000
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
      # API Keys (from .env file or environment)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # gRPC fallback config (only used when TRANSPORT=grpc)
      GRPC_PORT: 50051
      GRPC_MAX_WORKERS: 10
      HYBRID_SEARCH_ENABLED: "true"
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: "0.90"
      LLM_MODEL: "claude-sonnet-4-20250514"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL with pgvector extension (shared with backend)
  db:
    image: pgvector/pgvector:pg16
    container_name: themison-new-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: themison_new
    volumes:
      - postgres_new_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_new_data:
